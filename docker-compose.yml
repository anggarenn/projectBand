# ==============================================================================
# Sikobokan Next.js 16 Web Application - Docker Compose
# ==============================================================================

services:
  invitation-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sikobokan-invitation-app
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
